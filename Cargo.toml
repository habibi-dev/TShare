[package]
name = "TShare"
version = "1.4.1"
edition = "2024"
license = "MIT"
authors = ["Habibi-Dev"]

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace]
members = [".", "migration"]

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
axum = { version = "0.8.6", features = ["multipart"] }

redis = { version = "*", features = ["connection-manager", "tokio-comp"] }
argon2 = { version = "*" }
sha2 = { version = "*" }
base64 = { version = "*" }
aes-gcm = { version = "*" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
migration = { path = "migration" }
anyhow = "1.0.100"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
mime_guess = "2.0.5"
rand = "0.9.2"
askama = "0.15.4"
validator = { version = "0.20.0", features = ["derive"] }
tower = { version = "0.5.2", features = ["timeout"] }
tower-http = { version = "0.6.6", features = ["trace"] }
chrono = { version = "0.4.39", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
lazy_static = "1.5.0"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
bytes = "1"
suppaftp = { version = "6", features = ["native-tls"] }
