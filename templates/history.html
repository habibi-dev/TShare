<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TShare.ir | تاریخچه اشتراک‌گذاری شما</title>
  <link rel="stylesheet" href="{{url}}css/style.css?ver={{version}}">
  <link rel="icon" href="{{url}}favicon.ico?ver={{version}}" sizes="any">
  <meta name="theme-color" content="#e50561">
  <script src="{{url}}js/i18n.js?ver={{version}}"></script>
  <script src="{{url}}js/modal.js?ver={{version}}"></script>
  <script defer="defer" src="{{url}}js/app.js?ver={{version}}"></script>
</head>
<body>
<div class="background-animation">
  <div class="floating-sphere sphere-1"></div>
  <div class="floating-sphere sphere-2"></div>
  <div class="floating-sphere sphere-3"></div>
</div>
{% include "partials/header.html" %}

<div class="content">
  <div class="header">
    <h2 data-i18n="history.title">Your share history</h2>
    <p data-i18n="history.subtitle"></p>
  </div>
  <ul class="history-list"></ul>
  <a href="{{url}}" class="submit-btn" style="flex: 0; font-size: 1rem; text-decoration: none;display: flex">
    <span data-i18n="history.back">Back to home</span>
  </a>
</div>

{% include "partials/footer.html" %}
</body>
</html>
