<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>TShare.ir | اشتراک امن و موقت متن و فایل</title>
    <link rel="stylesheet" href="{{url}}css/style.css?ver={{version}}">
    <meta name="description"
          content="ابزار ساده برای اشتراک‌گذاری متن، یادداشت و فایل‌های ضروری. بدون ثبت‌نام، لینک ایجاد کنید و محتوا را به راحتی منتقل کنید.">

    <meta property="og:title" content="TShare.ir | اشتراک امن و موقت متن و فایل">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="{{url}}img/og-preview.png">
    <meta property="og:description"
          content="ابزار ساده برای اشتراک‌گذاری متن و فایل‌های ضروری. مناسب برای ارسال آدرس، شماره تماس، تصویر، سند یا یادداشت‌های روزمره.">
    <meta property="og:locale" content="fa_IR">
    <meta property="og:image:alt" content="TShare.ir | اشتراک امن و موقت متن و فایل">

    <link rel="icon" href="{{url}}favicon.ico?ver={{version}}" sizes="any">
    <link rel="icon" href="{{url}}icon.svg?ver={{version}}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{url}}icon.png?ver={{version}}">

    <link rel="manifest" href="{{url}}site.webmanifest?ver={{version}}">
    <meta name="theme-color" content="#e50561">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="{{url}}js/i18n.js?ver={{version}}"></script>
    <script src="{{url}}js/modal.js?ver={{version}}"></script>
    <script defer="defer" src="{{url}}js/app.js?ver={{version}}"></script>
</head>

<body>

<div class="background-animation">
    <div class="floating-sphere sphere-1"></div>
    <div class="floating-sphere sphere-2"></div>
    <div class="floating-sphere sphere-3"></div>
</div>
{% include "partials/header.html" %}
<div class="content">
    <div class="header">
        <h2 data-i18n="home.title">Secure, ephemeral text & file sharing</h2>
        <p data-i18n="home.subtitle" data-i18n-html></p>
    </div>

    <div class="alert">
        <p>{{message}}</p>
    </div>
    <form method="get" class="form" id="shareFormPassword" style="display: flex">
        <div class="password-wrapper" id="passwordReq">
            <label for="password">
                <input type="password" maxlength="24" required id="password" name="password" autofocus
                       autocapitalize="off"
                       autocomplete="off"
                       data-i18n-placeholder="password.passwordPlaceholder" placeholder="">
            </label>
        </div>
        <div class="footer inline-footer">
            <button type="submit" class="show" data-i18n="password.view">View</button>
        </div>
        <div class="delete-box">
            <button type="button" class="delete" data-i18n="show.delete">Delete this share</button>
            <a href="{{url}}" style="flex: 0;font-size: 1rem;text-decoration: none;display: flex;text-align: center;width: 100%;justify-content: center;color: #8b8b8b;margin-top: 3rem;"
               data-i18n="show.backHome">Back to home</a>
        </div>
    </form>
</div>

{% include "partials/footer.html" %}

</body>
</html>
